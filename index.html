<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F4EE">
    <title>BEA'S — Beauty &amp; Scent</title>
    <meta name="description"
        content="BEA'S Beauty &amp; Scent parfüm koleksiyonu: kod veya isimle arayın, koku profili anketiyle size uygun parfümü bulun.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="BEA'S — Beauty &amp; Scent">
    <meta property="og:description"
        content="Parfüm kodu veya isimle arayın; koku profili anketiyle size uygun parfümü bulun.">
    <meta property="og:url" content="https://beasfind.com/">
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="assets/icon-b.svg">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* --- BEA'S · BEAUTY & SCENT — LIGHT MINIMAL THEME --- */
        :root {
            --bg-body: #F4F1E9;
            --bg-app: #FFFFFF;
            --surface-soft: #FBF8F2;
            --text-primary: #1D1D1B;
            --text-secondary: #6C675E;
            --text-muted: #A69E90;
            --border: #E8E2D6;
            --border-strong: #D9D1C1;
            --accent: #A8834E;
            --accent-dark: #856437;
            --accent-soft: #F5EDE0;
            --app-width: 600px;
            --radius: 12px;
            --shadow-soft: 0 1px 2px rgba(29, 29, 27, .04), 0 10px 28px rgba(29, 29, 27, .06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #F7F4EE;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            overflow-y: auto;
            transition: opacity 0.5s ease-out;
        }

        .splash-logo-img {
            width: clamp(190px, 58vw, 250px);
            height: auto;
            display: block;
        }

        .splash-sub {
            margin: 18px 0 34px;
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .lang-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 330px;
        }

        .lang-btn {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 12px 0;
            width: 101px;
            font-family: inherit;
            letter-spacing: 1.2px;
            font-weight: 500;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .lang-btn:hover,
        .lang-btn:focus-visible {
            border-color: var(--accent);
            color: var(--accent-dark);
            background: var(--accent-soft);
            outline: none;
        }

        /* --- ACCESS LOCK (4 haneli giriş kodu) --- */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: #F7F4EE;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            transition: opacity 0.4s ease;
        }

        .lock-form {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 10px;
        }

        .pin-input {
            width: 208px;
            padding: 14px 0 14px 12px;
            text-align: center;
            font-family: inherit;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 16px;
            color: var(--text-primary);
            background: #fff;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pin-input::placeholder {
            color: #D5CDBF;
            letter-spacing: 12px;
        }

        .pin-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 131, 78, .12);
        }

        .pin-input:focus::placeholder {
            color: transparent;
        }

        .pin-input.pin-shake {
            animation: pinShake 0.35s ease;
            border-color: #B4483C;
        }

        @keyframes pinShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }

        .pin-btn {
            background: var(--text-primary);
            color: #fff;
            border: none;
            font-family: inherit;
            font-size: 20px;
            font-weight: 500;
            line-height: 1;
            padding: 0;
            width: 56px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pin-btn:hover,
        .pin-btn:focus-visible {
            background: var(--accent-dark);
            outline: none;
        }

        .pin-error {
            min-height: 18px;
            margin-top: 14px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.6px;
            color: #B4483C;
            text-align: center;
            text-transform: uppercase;
        }

        /* --- APP CONTAINER --- */
        .app-container {
            width: 100%;
            max-width: var(--app-width);
            background-color: var(--bg-app);
            min-height: 100vh;
            position: relative;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.6s ease;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            z-index: 1;
        }

        /* --- HEADER --- */
        .header {
            padding: 12px 16px 10px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }

        .brand-mark {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .brand-mark img {
            height: 24px;
            width: auto;
            display: block;
        }

        .lang-switch-small {
            font-family: inherit;
            font-size: 9px;
            letter-spacing: 1.6px;
            font-weight: 600;
            color: var(--text-secondary);
            background: #fff;
            cursor: pointer;
            border: 1px solid var(--border-strong);
            padding: 6px 11px;
            border-radius: 999px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .lang-switch-small:hover {
            border-color: var(--accent);
            color: var(--accent-dark);
        }

        /* SEARCH INPUT */
        .search-box {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: #fff;
            border: 1px solid var(--border-strong);
            padding: 13px 16px 13px 44px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 131, 78, 0.13);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 11px;
            pointer-events: none;
        }

        [dir="rtl"] .search-input {
            padding-left: 16px;
            padding-right: 44px;
        }

        [dir="rtl"] .search-icon {
            left: auto;
            right: 16px;
        }

        /* --- STYLIST / QUIZ BUTTON --- */
        .header-actions {
            width: 100%;
        }

        .stylist-btn {
            width: 100%;
            margin-top: 8px;
            background: var(--text-primary);
            border: 1px solid var(--text-primary);
            color: #F8F5EF;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .stylist-btn:hover {
            background: #000;
            border-color: #000;
        }

        .stylist-btn span {
            color: var(--accent);
            font-size: 11px;
        }

        /* --- CONTENT LIST --- */
        .content-area {
            padding: 14px 16px 40px;
            flex: 1;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 15px 14px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-soft);
        }

        .card.active {
            border-color: var(--accent);
        }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .code-pill {
            background: var(--text-primary);
            color: #F8F5EF;
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: 0.6px;
            padding: 7px 10px;
            border-radius: 6px;
            min-width: 66px;
            text-align: center;
            margin-right: 12px;
            flex: none;
        }

        [dir="rtl"] .code-pill {
            margin-right: 0;
            margin-left: 12px;
        }

        .info-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .family-text {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .beas-name {
            font-size: 13.5px;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .perfume-name {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.35;
            margin-top: 3px;
            overflow-wrap: anywhere;
        }

        .sizes-text {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1.1px;
            margin-top: 5px;
        }

        .sizes-text span {
            display: inline-block;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            margin-right: 4px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .arrow {
            color: var(--text-muted);
            font-size: 9px;
            transition: transform 0.3s;
            flex: none;
        }

        .card.active .arrow {
            transform: rotate(180deg);
            color: var(--accent);
        }

        /* Detaylar */
        .details-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            opacity: 0;
        }

        .card.active .details-panel {
            max-height: 340px;
            opacity: 1;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            margin-top: 14px;
        }

        .compare-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 38%;
        }

        .side-label {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1.4px;
        }

        .bottle-icon {
            width: 34px;
            height: 56px;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-soft);
        }

        .bottle-icon::before {
            content: '';
            width: 15px;
            height: 7px;
            background: var(--border-strong);
            position: absolute;
            top: -7px;
            border-radius: 1px;
        }

        .bottle-v {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-secondary);
            transform: rotate(-90deg);
        }

        .vs {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .view-btn {
            text-decoration: none;
            color: #F8F5EF;
            background: var(--text-primary);
            padding: 9px 12px;
            font-size: 9.5px;
            border-radius: 7px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .view-btn:hover {
            background: var(--accent-dark);
        }

        /* FILTER SECTION */
        .filter-section {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        #initialButton {
            margin-top: 4px;
        }

        .show-all-btn {
            background: transparent;
            border: none;
            color: var(--accent-dark);
            padding: 8px 4px;
            font-family: inherit;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 1.6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--border-strong);
        }

        .show-all-btn:hover {
            color: var(--text-primary);
            text-decoration-color: var(--accent);
        }

        .filter-btn {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 9px 13px;
            font-size: 9.5px;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 999px;
            text-transform: uppercase;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent-dark);
            background: var(--accent-soft);
        }

        .filter-btn-active {
            background: var(--text-primary);
            color: #F8F5EF;
            border-color: var(--text-primary);
        }

        .filter-btn-active:hover {
            background: #000;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        .msg-box {
            text-align: center;
            padding: 56px 16px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.4px;
        }

        .msg-icon {
            font-size: 20px;
            margin-bottom: 14px;
            color: var(--border-strong);
        }

        /* --- QUIZ OVERLAY --- */
        .quiz-overlay {
            position: fixed;
            inset: 0;
            background: rgba(29, 29, 27, 0.42);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            backdrop-filter: blur(4px);
        }

        .quiz-box {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(29, 29, 27, 0.2);
            border-top: 3px solid var(--accent);
            max-height: 90vh;
            overflow-y: auto;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            gap: 12px;
        }

        .quiz-title {
            color: var(--text-primary);
            font-size: 11px;
            letter-spacing: 1.6px;
            font-weight: 700;
            text-transform: uppercase;
            font-family: inherit;
        }

        .quiz-close {
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            line-height: 1;
            background: none;
            border: none;
            font-family: inherit;
        }

        .quiz-close:hover {
            color: var(--text-primary);
        }

        .question-text {
            font-size: 17px;
            color: var(--text-primary);
            margin-bottom: 18px;
            text-align: center;
            line-height: 1.45;
            font-weight: 500;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .quiz-opt-btn {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 14px;
            text-align: left;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .quiz-opt-btn:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .quiz-step {
            text-align: center;
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 18px;
            letter-spacing: 2px;
        }

        /* --- SCROLLED HEADER --- */
        .header.scrolled .brand-row {
            display: none;
        }

        .header.scrolled {
            padding-top: 10px;
        }

        @media (max-width: 640px) {
            .app-container {
                border-left: none;
                border-right: none;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 10px 14px 8px;
            }

            .brand-mark img {
                height: 21px;
            }

            .brand-row {
                margin-bottom: 10px;
            }

            .search-input {
                padding: 12px 14px 12px 40px;
            }

            .search-icon {
                left: 14px;
            }

            .stylist-btn {
                padding: 11px 10px;
                font-size: 9.5px;
                letter-spacing: 1px;
            }

            .content-area {
                padding: 12px 14px 36px;
            }

            .card {
                padding: 13px 12px;
                margin-bottom: 9px;
            }

            .perfume-name {
                font-size: 12px;
            }

            .code-pill {
                min-width: 60px;
                font-size: 12px;
                padding: 6px 9px;
                margin-right: 10px;
            }

            .view-btn {
                padding: 8px 10px;
                font-size: 9px;
                letter-spacing: 0.5px;
            }

            .question-text {
                font-size: 15.5px;
            }

            .quiz-box {
                padding: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="lock-screen" class="hidden">
        <img class="splash-logo-img" src="assets/logo.svg" alt="BEA'S — Beauty &amp; Scent" width="202"
            height="63">
        <div class="splash-sub" id="lockLabel"></div>
        <form class="lock-form" id="lockForm" onsubmit="submitPin(event)">
            <input type="tel" class="pin-input" id="pinInput" inputmode="numeric" pattern="[0-9]*"
                maxlength="4" autocomplete="one-time-code" placeholder="••••" aria-label="Giriş kodu">
            <button type="submit" class="pin-btn" aria-label="Giriş">→</button>
        </form>
        <div class="pin-error" id="pinError" role="alert"></div>
    </div>

    <div id="splash-screen">
        <img class="splash-logo-img" src="assets/logo.svg" alt="BEA'S — Beauty &amp; Scent" width="202"
            height="63">
        <div class="splash-sub">FRAGRANCE FINDER</div>

        <div class="lang-grid">
            <button type="button" class="lang-btn" onclick="enterApp('tr')">TÜRKÇE</button>
            <button type="button" class="lang-btn" onclick="enterApp('en')">ENGLISH</button>
            <button type="button" class="lang-btn" onclick="enterApp('ru')">РУССКИЙ</button>
            <button type="button" class="lang-btn" onclick="enterApp('ar')">عربي</button>
            <button type="button" class="lang-btn" onclick="enterApp('ua')">УКРАЇНСЬКА</button>
            <button type="button" class="lang-btn" onclick="enterApp('ro')">ROMÂNĂ</button>
            <button type="button" class="lang-btn" onclick="enterApp('fr')">FRANÇAIS</button>
            <button type="button" class="lang-btn" onclick="enterApp('hu')">MAGYAR</button>
            <button type="button" class="lang-btn" onclick="enterApp('sq')">SHQIP</button>
            <button type="button" class="lang-btn" onclick="enterApp('mk')">МАКЕДОНСКИ</button>
            <button type="button" class="lang-btn" onclick="enterApp('el')">ΕΛΛΗΝΙΚΑ</button>
            <button type="button" class="lang-btn" onclick="enterApp('sr')">SRPSKI</button>
            <button type="button" class="lang-btn" onclick="enterApp('es')">ESPAÑOL</button>
            <button type="button" class="lang-btn" onclick="enterApp('tg')">ТОҶИКӢ</button>
            <button type="button" class="lang-btn" onclick="enterApp('uz')">O'ZBEK</button>
            <button type="button" class="lang-btn" onclick="enterApp('kk')">ҚАЗАҚША</button>

        // --- HELPER FUNCTIONS ---
        function cleanString(str) { return str.replace(/[^a-zA-Z0-9]/g, '').toUpperCase(); }

        // Kod sıralaması: M → W → U, her blok kendi içinde numaraya göre küçükten büyüğe
        function codeSortKey(item) {
            const prefix = item.code.charAt(0).toUpperCase();
            const rank = prefix === 'M' ? 1 : prefix === 'W' ? 2 : prefix === 'U' ? 3 : 4;
            const num = parseInt(item.code.replace(/[^0-9]/g, ''), 10);
            return rank * 10000 + (isNaN(num) ? 0 : num);
        }

        function sortByCode(items) {
            return items.slice().sort((a, b) => codeSortKey(a) - codeSortKey(b));
        }

        function levenshtein(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) == a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
                    else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                }
            }
            return matrix[b.length][a.length];
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function submitPin(event) {
            if (event) event.preventDefault();
            const input = document.getElementById('pinInput');
            const value = input.value.replace(/\D/g, '').slice(0, 4);
            input.value = value;
            if (value.length < 4) return;

            if (value === ACCESS_PIN) {
                try { sessionStorage.setItem(UNLOCK_KEY, '1'); } catch (e) { }
                unlockScreen();
            } else {
                const texts = pinTexts[currentLang] || pinTexts.en;
                document.getElementById('pinError').innerText = texts.error;
                input.value = '';
                input.classList.remove('pin-shake');
                void input.offsetWidth;
                input.classList.add('pin-shake');
                input.focus();
            }
        }

                input.classList.remove('pin-shake');
                if (input.value.length === 4) submitPin();

            if (!query && document.getElementById('initialButton').classList.contains('hidden') === false) {

                    if (itemNameClean === cleanQuery) score = 90;
                    else if (itemNameClean.includes(cleanQuery)) score = 70;
                    else if (cleanQuery.length > 2) {
                        const dist = levenshtein(cleanQuery, itemNameClean);
                        const maxLen = Math.max(cleanQuery.length, itemNameClean.length);
                        const similarity = 1 - (dist / maxLen);
                        if (similarity > 0.5) score = 50 * similarity;
                    }
                }
                return { ...item, score: score };
            });

            let filtered = scoredResults.filter(item => item.score > 25).sort((a, b) => b.score - a.score);

            if (activeFilter !== 'all') {
                filtered = filtered.filter(item => {
                    const codePrefix = item.code.charAt(0).toUpperCase();
                    if (activeFilter === 'men') return codePrefix === 'M';
                    if (activeFilter === 'women') return codePrefix === 'W';
                    if (activeFilter === 'unisex') return codePrefix === 'U';
                    return true;
                });
            }

            displayResults(filtered, resultsArea, t);
        }

        // Türkçe sayfada da marka adları İngilizce kuralla büyütülsün (i -> I, İ değil)
        function upper(str) {
            return (str || '').toLocaleUpperCase('en-US');
        }

        // Boyut rozetleri: katalogda işaretli olan ml'ler
        function sizesHtml(item) {
            if (!item.sizes || item.sizes.length === 0) return '';
            return `<div class="sizes-text">${item.sizes.map(s => `<span>${s} ML</span>`).join('')}</div>`;
        }

        // Tek kart şablonu: liste ve anket sonuçları aynı görünsün
        function cardInner(item, t) {
            const googleSearch = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent((item.name || item.beas) + " perfume bottle")}`;
            return `
                <div class="card-main">
                    <div style="display:flex; align-items:center; flex:1; min-width:0;">
                        <div class="code-pill">${item.code}</div>
                        <div class="info-col">
                            <div class="family-text">${item.family || 'FRAGRANCE'}</div>
                            <div class="beas-name">${upper(item.beas)}</div>
                            ${item.name ? `<div class="perfume-name">${upper(item.name)}</div>` : ''}
                            ${sizesHtml(item)}
                        </div>
                    </div>
                    <div class="arrow">▼</div>
                </div>

                <div class="details-panel">
                    <div class="compare-box">
                        <div class="side">
                            <div class="side-label">${t.beas}</div>
                            <div class="bottle-icon"><div class="bottle-v">B</div></div>
                        </div>
                        <div class="vs">vs</div>
                        <div class="side">
                            <div class="side-label">${t.orig}</div>
                            <a href="${googleSearch}" target="_blank" class="view-btn" onclick="event.stopPropagation()">
                                <span aria-hidden="true">↗</span> ${t.btn}
                            </a>
                        </div>
                    </div>
                </div>`;
        }

        function displayResults(filtered, resultsArea, t) {
            if (filtered.length === 0) {
                resultsArea.innerHTML = `<div class="msg-box">${t.empty}</div>`;
                return;
            }

            // Her zaman kod sırasıyla listele (M → W → U, küçükten büyüğe)
            filtered = sortByCode(filtered);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = function () { toggleCard(this); };
                card.innerHTML = cardInner(item, t);
                resultsArea.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', performSearch);

        // Mobilde kaydırınca logo satırını gizle (sticky başlık ince kalsın)
        const appHeader = document.getElementById('appHeader');
        let headerCollapsed = false;
        window.addEventListener('scroll', () => {
            const shouldCollapse = window.scrollY > 70;
            if (shouldCollapse !== headerCollapsed) {
                headerCollapsed = shouldCollapse;
                appHeader.classList.toggle('scrolled', shouldCollapse);
            }
        }, { passive: true });

        // --- QUIZ LOGIC ---
        let currentQuizStep = 0;
        let quizAnswers = {};

        function startQuiz() {
            currentQuizStep = 0;
            quizAnswers = {};
            document.getElementById('quiz-modal').classList.remove('hidden');
            renderQuestion();
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }

        function renderQuestion() {
            const q = quizQuestions[currentQuizStep];
            const content = document.getElementById('quiz-content');
            const lang = currentLang;

            if (!q) {
                showQuizResults();
                return;
            }

            let html = `
                <div class="question-text">${q.text[lang] || q.text['en']}</div>
                <div class="quiz-options">
            `;

            q.options.forEach((opt, idx) => {
                const text = opt.label[lang] || opt.label['en'];
                html += `<div class="quiz-opt-btn" onclick="handleAnswer(${idx})">
                            <span>${text}</span> <span>➜</span>
                         </div>`;
            });

            html += `</div>
                     <div class="quiz-step">${currentQuizStep + 1} / ${quizQuestions.length}</div>`;

            content.innerHTML = html;
        }

        function handleAnswer(optionIndex) {
            const q = quizQuestions[currentQuizStep];
            const selected = q.options[optionIndex];

            if (q.id === 'gender') quizAnswers.gender = selected.value;
            if (q.id === 'occasion') quizAnswers.style = selected.type;
            if (q.id === 'scent_char') quizAnswers.tags = selected.tags;
            if (q.id === 'sillage') quizAnswers.weight = selected.weight;

            currentQuizStep++;
            renderQuestion();
        }

        function showQuizResults() {
            const content = document.getElementById('quiz-content');
            const t = translations[currentLang];

            content.innerHTML = `<div class="msg-box"><div class="msg-icon">✨</div><div>${t.start}...</div></div>`;

            // 1. Score ALL Candidates first
            let allScored = fragranceData.map(item => {
                let score = 0;
                const family = item.family.toUpperCase();

                if (quizAnswers.tags) {
                    quizAnswers.tags.forEach(tag => {
                        if (family.includes(tag)) score += 20;
                    });
                }

                if (quizAnswers.style === 'fresh') {
                    if (family.includes('CITRUS') || family.includes('AQUATIC') || family.includes('GREEN')) score += 15;
                    if (family.includes('ORIENTAL') || family.includes('OUD')) score -= 10;
                } else if (quizAnswers.style === 'heavy') {
                    if (family.includes('ORIENTAL') || family.includes('SPICY') || family.includes('GOURMAND') || family.includes('OUD')) score += 15;
                    if (family.includes('CITRUS') && !family.includes('WOODY')) score -= 5;
                }

                if (quizAnswers.weight === 3) {
                    if (family.includes('OUD') || family.includes('VANILLA') || family.includes('AMBERY')) score += 10;
                }

                return { ...item, score: score };
            }).filter(i => i.score > 0);

            // 2. Logic: Create 5 Results based on Gender Selection
            let finalSelection = [];
            const selectionCount = 5;

            if (quizAnswers.gender === 'unisex') {
                // If unisex selected, pool only U codes
                let pool = allScored.filter(i => i.code.startsWith('U')).sort((a, b) => b.score - a.score).slice(0, 15);
                finalSelection = shuffleArray(pool).slice(0, selectionCount);
            } else {
                // Gender Specific Logic
                const targetPrefix = quizAnswers.gender === 'men' ? 'M' : 'W';

                // Primary Pool (Target Gender) - Top 15 candidates
                let primaryDocs = allScored.filter(i => i.code.startsWith(targetPrefix)).sort((a, b) => b.score - a.score).slice(0, 15);
                // Secondary Pool (Unisex) - Top 10 candidates
                let secondaryDocs = allScored.filter(i => i.code.startsWith('U')).sort((a, b) => b.score - a.score).slice(0, 10);

                // Shuffle Pools for Randomness
                primaryDocs = shuffleArray(primaryDocs);
                secondaryDocs = shuffleArray(secondaryDocs);

                // Logic: Take 3 from Primary, 2 from Secondary (Max 2 unisex rule)
                // This ensures 3/5 matches are gender specific
                let selectedPrimary = primaryDocs.slice(0, 3);
                let selectedSecondary = secondaryDocs.slice(0, 2);

                finalSelection = [...selectedPrimary, ...selectedSecondary];

                // If total is less than 5, try to fill up from primary again
                if (finalSelection.length < 5) {
                    let extraNeeded = 5 - finalSelection.length;
                    let morePrimary = primaryDocs.slice(3, 3 + extraNeeded);
                    finalSelection = [...finalSelection, ...morePrimary];
                }
            }

            // Final shuffle so the output isn't sorted by gender (e.g. MMMUU) but mixed (MUMUM)
            finalSelection = shuffleArray(finalSelection);

            // 4. Render
            if (finalSelection.length === 0) {
                content.innerHTML = `<div style="text-align:center; padding:20px;">
                    <div style="font-size:3rem;">🤷‍♂️</div>
                    <p style="margin-top:20px;">${t.empty}</p>
                    <button class="view-btn" style="margin:20px auto;" onclick="startQuiz()">RESTART</button>
                </div>`;
            } else {
                let html = `<div style="text-align:center; color:var(--text-secondary); margin-bottom:14px; font-size:10px; letter-spacing:2px; font-weight:600;">TOP MATCHES</div>`;

                finalSelection.forEach(item => {
                    html += `<div class="card" onclick="toggleCard(this)">${cardInner(item, t)}</div>`;
                });

                html += `<button type="button" class="view-btn" style="width:100%; justify-content:center; margin-top:15px;" onclick="startQuiz()">RESTART</button>`;
                html += `<button type="button" class="view-btn" style="width:100%; justify-content:center; margin-top:10px; background:transparent; border:1px solid var(--border-strong); color:var(--text-secondary);" onclick="closeQuiz()">CLOSE</button>`;
                content.innerHTML = html;
            }
        }

    </script>
</body>

</html>
